[package]
name = "guardpost"
version = "0.1.0"
description = "GuardPost — Wazuh Agent Installer"
authors = ["ADORSYS-GIS"]
license = "MIT"
repository = "https://github.com/chojuninengu/guardpost"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "guardpost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "guardpost"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
which = "7"
libc = "0.2.186"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
