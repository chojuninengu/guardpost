name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release-id: ${{ steps.create-release.outputs.id }}
      release-upload-url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release (draft)
        id: create-release
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GuardPost ${{ github.ref_name }}
          releaseBody: |
            ## GuardPost ${{ github.ref_name }}

            ### Install

            **Linux (Debian/Ubuntu)**
            ```bash
            sudo dpkg -i guardpost_*_amd64.deb
            ```
            Or via APT repo — see README.

            **macOS**
            Open the `.dmg` and drag GuardPost to Applications.
            Or via Homebrew — see README.

            **Windows**
            Run the `.exe` installer (UAC prompt will appear — this is expected).

            ### What's included
            - Wazuh agent installer with guided setup wizard
            - System tray icon
            - Network intrusion detection (Suricata / Snort)
            - Optional Trivy vulnerability scanner
          releaseDraft: true
          prerelease: false

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os-name: linux
            artifact-name: linux
          - platform: macos-latest
            os-name: macos
            artifact-name: macos
          - platform: windows-latest
            os-name: windows
            artifact-name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Fetch bundled scripts
        shell: bash
        run: bash scripts/fetch-scripts.sh

      - name: Install frontend deps
        run: npm ci

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          tauriScript: npx tauri

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release-id }},
              draft: false,
            });
