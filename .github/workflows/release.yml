name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release-id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release (draft)
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GuardPost ${{ github.ref_name }}
          body: |
            ## GuardPost ${{ github.ref_name }}

            ### Install

            **Linux (Debian/Ubuntu)**
            ```bash
            sudo dpkg -i guardpost_*_amd64.deb
            ```
            Or via APT repo — see README.

            **macOS**
            Open the `.dmg` and drag GuardPost to Applications.
            Or via Homebrew — see README.

            **Windows**
            Run the `.exe` installer (UAC prompt will appear — this is expected).

            ### What's included
            - Wazuh agent installer with guided setup wizard
            - System tray icon
            - Network intrusion detection (Suricata / Snort)
            - Optional Trivy vulnerability scanner
          draft: true
          prerelease: false

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os-name: linux
          - platform: macos-latest
            os-name: macos
          - platform: windows-latest
            os-name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Fetch bundled scripts
        shell: bash
        run: bash scripts/fetch-scripts.sh

      - name: Install frontend deps
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Find all bundle artifacts
          shopt -s nullglob
          artifacts=(src-tauri/target/release/bundle/**/*.{deb,rpm,AppImage,dmg,msi,exe} 2>/dev/null || true)
          if [ ${#artifacts[@]} -eq 0 ]; then
            # Fallback: just upload everything in the bundle dir
            artifacts=(src-tauri/target/release/bundle/*/*)
          fi
          for artifact in "${artifacts[@]}"; do
            echo "Uploading: $artifact"
            gh release upload "${{ github.ref_name }}" "$artifact" --repo "${{ github.repository }}" --clobber
          done

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release-id }},
              draft: false,
            });
